<!-- Orchexa VoiceAgent widget -->
<script>
  (function(w, d, s, id) {
    var js, fjs = d.getElementsByTagName(s)[0];
    if (d.getElementById(id)) return;
    js = d.createElement(s); js.id = id;
    js.src = "https://app.orchexa.io/sdk/voice-agent.js?v=v2.7.1-mobile-layout";
    fjs.parentNode.insertBefore(js, fjs);
    js.onload = function() {
      VoiceAgent.init({
        widgetId: "a238ea66-6802-45b9-b035-94ed24573a1e",
        apiUrl: "https://api.orchexa.io/api/v1"
      });

      VoiceAgent.on('call.connected', function() {
        console.log('Voice call connected!');
      });

      VoiceAgent.on('error', function(error) {
        console.error('Widget error:', error);
      });
    };
  }(window, document, 'script', 'voice-agent-sdk'));
</script>
